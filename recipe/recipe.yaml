context:
  version: "2.1.0"

package:
  name: mastermsm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mastermsm/mastermsm-${{ version }}.tar.gz
  sha256: cb53d8317041c8abd433ed0080cd6609e8d8a534ec093fd5a8a30a739983d490

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - matplotlib-base
    - networkx
    - mdtraj
    - scikit-learn

tests:
  - python:
      imports:
        - mastermsm
        - mastermsm.trajectory
        - mastermsm.msm
        - mastermsm.fewsm
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  # MASTERMSM_NO_DOWNLOAD: tests that need the MD trajectories from
  # OSF are skipped without network access (offline CI)
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      env:
        MASTERMSM_NO_DOWNLOAD: "1"
      content:
        - pytest --pyargs mastermsm -q -rs
  - requirements:
      run:
        - python
        - pytest
    script:
      env:
        MASTERMSM_NO_DOWNLOAD: "1"
      content:
        - pytest --pyargs mastermsm -q -rs

about:
  homepage: https://github.com/BioKT/MasterMSM
  summary: Algorithms to construct master equation / Markov state models
  description: |
    MasterMSM is a Python package for building Markov state models (MSMs)
    from molecular dynamics trajectories, using the chemical master
    equation formulation. It covers featurization, dimensionality
    reduction, discretization, estimation of transition and rate matrices
    with error analysis, and coarse-graining into few-state models.
  license: GPL-2.0-or-later
  license_file: LICENSE
  documentation: https://mastermsm.readthedocs.io
  repository: https://github.com/BioKT/MasterMSM

extra:
  recipe-maintainers:
    - daviddesancho
